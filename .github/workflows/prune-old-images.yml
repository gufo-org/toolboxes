name: Prune Old Container Images

on:
  schedule:
    # Run once a week at midnight Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Avoid overlapping cleanup runs. New rolling images have no SHA tags.
concurrency:
  group: prune-container-images
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove legacy SHA-only versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prune-sha-images.py --apply

      - name: Prune old untagged container versions in GHCR
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: gufo-org
          image-names: "toolboxes/gufo-runtime toolboxes/gufo-dev"
          tag-selection: untagged
          cut-off: 30d
          token: ${{ secrets.GITHUB_TOKEN }}
