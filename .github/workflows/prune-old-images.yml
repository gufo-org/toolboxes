name: Prune Old Container Images

on:
  schedule:
    # Run once a week at midnight Sunday
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Prune old container versions in GHCR
        uses: snok/container-retention-policy@v3.1.0
        with:
          account: gufo-org
          image-names: "toolboxes/gufo-runtime toolboxes/gufo-dev toolboxes/eval-agent toolboxes/gufo-eval-agent"
          cut-off: 30d
          keep-n-most-recent: 3
          token: ${{ secrets.GITHUB_TOKEN }}
