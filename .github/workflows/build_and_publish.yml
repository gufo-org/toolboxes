name: Build & Publish Gufo OCI Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      images:
        description: 'Comma-separated images to build, or "all"'
        required: false
        default: 'all'

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix_json: ${{ steps.matrix.outputs.matrix_json }}
    steps:
      - id: matrix
        shell: bash
        run: |
          IN="${{ inputs.images || 'all' }}"
          if [[ "$IN" == "all" || -z "$IN" ]]; then
            echo 'matrix_json=["gufo-runtime","gufo-dev"]' >> "$GITHUB_OUTPUT"
          else
            IN_CLEAN=$(echo "$IN" | tr -d '[:space:]')
            echo "matrix_json=[\"${IN_CLEAN//,/\",\"}\"]" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.matrix_json) }}

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build OCI image with Nix
        run: |
          echo "🔨 Building ${{ matrix.target }}-image with Nix..."
          nix build .#packages.x86_64-linux.${{ matrix.target }}-image --out-link result-${{ matrix.target }}

      - name: Load and Push image to GHCR
        run: |
          set -euo pipefail
          BUILD_TS=$(date +%Y%m%dT%H%M%S)
          IMAGE_NAME="${{ env.IMAGE_PREFIX }}/${{ matrix.target }}"

          echo "📥 Loading image into Docker daemon..."
          docker load < result-${{ matrix.target }}

          echo "🏷️ Tagging image..."
          docker tag "${IMAGE_NAME}:latest" "${IMAGE_NAME}:${BUILD_TS}"

          echo "🚀 Pushing latest..."
          docker push "${IMAGE_NAME}:latest"

          echo "🚀 Pushing immutable timestamp tag ${BUILD_TS}..."
          docker push "${IMAGE_NAME}:${BUILD_TS}"
