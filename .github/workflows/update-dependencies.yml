name: Update Gufo Dependencies

on:
  schedule:
    # Daily at 04:23 UTC. The non-round minute reduces scheduler congestion.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-gufo-dependencies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Create release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://gufo.cachix.org
            extra-trusted-public-keys = gufo.cachix.org-1:rfZe3n4lHINgyoACKzs5EthIZmBNvEyCCtufUpth0PE=
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Update Gufo input
        run: nix flake update gufo-engine

      - name: Validate updated lock file
        run: nix flake check --no-build

      - name: Open pull request and enable auto-merge
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: deps/update-gufo
        run: |
          if git diff --quiet -- flake.lock; then
            echo "No dependency updates available."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add flake.lock
          git commit -m "chore(deps): update Gufo"
          git push --force origin "$BRANCH"

          pr=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')
          if [[ -z "$pr" ]]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(deps): update Gufo" \
              --body "Automated update of the \`gufo-engine\` flake input."
          fi

          gh pr merge "$BRANCH" --squash --auto --delete-branch
