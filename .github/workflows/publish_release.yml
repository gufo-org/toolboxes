name: Publish Stable Gufo Releases

on:
  repository_dispatch:
    types:
      - gufo-release
  workflow_dispatch:
    inputs:
      tag:
        description: Gufo release tag, for example v0.2.0
        required: true
        type: string
      windows-only:
        description: Rebuild and upload only the Windows ZIP
        required: false
        type: boolean
        default: false
      deb-only:
        description: Build and upload only the Debian package
        required: false
        type: boolean
        default: false
      replace-deb-assets:
        description: Replace the Debian package and checksum already attached to this tag
        required: false
        type: boolean
        default: false
      replace-windows-assets:
        description: Replace the Windows ZIP and checksum already attached to this tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-stable-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      series: ${{ steps.release.outputs.series }}
    steps:
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          WINDOWS_ONLY: ${{ inputs.windows-only || false }}
          DEB_ONLY: ${{ inputs.deb-only || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a Gufo release tag like v0.2.0, got: $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ "$WINDOWS_ONLY" == true && "$DEB_ONLY" == true ]]; then
            echo "Choose either windows-only or deb-only, not both" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          {
            echo "tag=${RELEASE_TAG}"
            echo "version=${version}"
            echo "series=${version%.*}"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.deb-only) }}
    needs: prepare
    permissions:
      actions: read
      contents: read
    # Merge Gufo's reusable workflow before enabling this caller. The build
    # definition follows main; its source checkout uses this exact release tag.
    uses: gufo-org/gufo/.github/workflows/windows-build.yml@main
    with:
      release-tag: ${{ needs.prepare.outputs.tag }}

  publish-windows:
    needs: [prepare, build-windows]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      REPLACE_WINDOWS_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.replace-windows-assets }}
    steps:
      # Artifacts uploaded by a called workflow belong to this Toolboxes run.
      - name: Download Windows release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-windows.outputs.artifact-name }}
          path: release

      - name: Verify Windows release checksum
        working-directory: release
        run: sha256sum --check "gufo-${RELEASE_TAG}-windows-x86_64.zip.sha256"

      # Mint after the Windows build: installation tokens expire in an hour.
      - name: Create Gufo release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: gufo-org
          repositories: gufo
          permission-contents: write

      - name: Attach Windows assets to the Gufo release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo gufo-org/gufo
          upload_args=()
          if [[ "$REPLACE_WINDOWS_ASSETS" == true ]]; then
            upload_args+=(--clobber)
          fi
          gh release upload "$RELEASE_TAG" --repo gufo-org/gufo "${upload_args[@]}" \
            "release/gufo-${RELEASE_TAG}-windows-x86_64.zip" \
            "release/gufo-${RELEASE_TAG}-windows-x86_64.zip.sha256"

  build-deb:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.windows-only) }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      # Read and write the Docker layer cache in GHCR.
      packages: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      # Every layer of both targets, mode=max, one tag per target. The cache
      # lives in GHCR rather than the Actions cache, which the multi-GB ROCm
      # builder would crowd out of its 10 GB limit.
      DEB_CACHE: ghcr.io/${{ github.repository }}/gufo-deb-cache
    steps:
      # The builder exists twice (BuildKit's store and the loaded image).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Cached apt layers would otherwise keep the first fill's ROCm and
      # Debian packages, and with them the Depends lower bounds, until the
      # base image changes. A new InRelease in either archive changes the
      # epoch and rebuilds the builder stage; XRT stays cached. Without the
      # files, fall back to the ISO week.
      - name: Identify the package repository state
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          if epoch=$(for url in \
                https://stable.repo.amd.com/rocm/core/packages/debian13/dists/stable/InRelease \
                https://deb.debian.org/debian/dists/trixie/InRelease \
                https://deb.debian.org/debian/dists/trixie-updates/InRelease \
                https://security.debian.org/debian-security/dists/trixie-security/InRelease; do
                curl -fsSL --retry 3 --max-time 60 "$url"
              done | sha256sum | cut -c1-16); then
            echo "epoch=repos-$epoch" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cannot read the package repository state; using a weekly epoch"
            echo "epoch=week-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          fi

      # A Dockerfile change rebuilds only its stage and those after it. Cache
      # export failures warn instead of failing the release.
      - name: Build Debian builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deb
          file: deb/Dockerfile
          target: builder
          tags: gufo-deb-builder
          build-args: DEPS_EPOCH=${{ steps.deps.outputs.epoch }}
          load: true
          provenance: false
          sbom: false
          cache-from: type=registry,ref=${{ env.DEB_CACHE }}:builder
          cache-to: type=registry,ref=${{ env.DEB_CACHE }}:builder,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      - name: Build Debian runtime test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: deb
          file: deb/Dockerfile
          target: runtime
          tags: gufo-deb-runtime
          load: true
          provenance: false
          sbom: false
          cache-from: |
            type=registry,ref=${{ env.DEB_CACHE }}:runtime
            type=registry,ref=${{ env.DEB_CACHE }}:builder
          cache-to: type=registry,ref=${{ env.DEB_CACHE }}:runtime,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

      # Restore the newest compiler cache; each run saves its own entry and
      # the cache pruning workflow keeps only the newest.
      - name: Restore compiler cache
        id: ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deb-ccache
          key: gufo-deb-ccache-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            gufo-deb-ccache-v1-

      - name: Build the release package
        run: |
          mkdir -p release "$RUNNER_TEMP/deb-ccache"
          docker run --rm --memory 12g --memory-swap 12g \
            -e CCACHE_DIR=/ccache -e CCACHE_MAXSIZE=2G \
            -v "$RUNNER_TEMP/deb-ccache:/ccache" \
            -v "$PWD:/work" gufo-deb-builder \
            deb/build-deb "$RELEASE_TAG" /work/release

      # Also after a failed build: its objects still help the next attempt.
      # The container writes the cache as root.
      # An empty directory would become the newest entry: skip it.
      - name: Prepare compiler cache for saving
        id: ccache-save
        if: always() && steps.ccache.outcome == 'success'
        run: |
          dir="$RUNNER_TEMP/deb-ccache"
          if [[ -d $dir && -n $(ls -A "$dir") ]]; then
            sudo chown -R "$(id -u):$(id -g)" "$dir"
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save compiler cache
        if: always() && steps.ccache-save.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deb-ccache
          key: gufo-deb-ccache-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify installation in a fresh Debian container
        run: |
          docker run --rm -v "$PWD:/work" gufo-deb-runtime \
            deb/verify-deb "/work/release/gufo_${RELEASE_VERSION}-1_amd64.deb" "$RELEASE_VERSION"

      - name: Preserve Debian release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-release-${{ needs.prepare.outputs.tag }}
          path: |
            release/*.deb
            release/*.deb.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Create Gufo release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: gufo-org
          repositories: gufo
          permission-contents: write

      - name: Attach Debian assets to the Gufo release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPLACE_DEB_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.replace-deb-assets }}
        working-directory: release
        run: |
          sha256sum --check "gufo_${RELEASE_VERSION}-1_amd64.deb.sha256"
          gh release view "$RELEASE_TAG" --repo gufo-org/gufo
          upload_args=()
          if [[ "$REPLACE_DEB_ASSETS" == true ]]; then
            upload_args+=(--clobber)
          fi
          gh release upload "$RELEASE_TAG" --repo gufo-org/gufo "${upload_args[@]}" \
            "gufo_${RELEASE_VERSION}-1_amd64.deb" \
            "gufo_${RELEASE_VERSION}-1_amd64.deb.sha256"

  build-and-push:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.windows-only || inputs.deb-only)) }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - gufo-runtime
          - gufo-dev
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SERIES: ${{ needs.prepare.outputs.series }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://gufo.cachix.org
            extra-trusted-public-keys = gufo.cachix.org-1:rfZe3n4lHINgyoACKzs5EthIZmBNvEyCCtufUpth0PE=
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Gufo release identity
        shell: bash
        run: |
          set -euo pipefail
          gufo_input="github:gufo-org/gufo/${RELEASE_TAG}"
          actual_version=$(nix eval --raw "${gufo_input}#lib.releaseVersion")
          if [[ "$actual_version" != "$RELEASE_VERSION" ]]; then
            echo "Tag ${RELEASE_TAG} reports version ${actual_version}, expected ${RELEASE_VERSION}" >&2
            exit 1
          fi

      - name: Publish stable image tags
        shell: bash
        run: |
          set -euo pipefail
          image_name="${{ env.IMAGE_PREFIX }}/${{ matrix.target }}"
          exact_image="${image_name}:${RELEASE_VERSION}"
          gufo_input="github:gufo-org/gufo/${RELEASE_TAG}"

          if docker manifest inspect "$exact_image" >/dev/null 2>&1; then
            echo "Using existing immutable image ${exact_image}."
            docker pull "$exact_image"
            publish_exact=false
          else
            nix build \
              --override-input gufo-engine "$gufo_input" \
              ".#packages.x86_64-linux.${{ matrix.target }}-release-image" \
              --out-link "result-${{ matrix.target }}"
            docker load < "result-${{ matrix.target }}"
            publish_exact=true
          fi

          docker run --rm "$exact_image" gufo --version \
            | grep -F "gufo version ${RELEASE_VERSION} ("
          if [[ "$publish_exact" == true ]]; then
            docker push "$exact_image"
          fi
          docker tag "$exact_image" "${image_name}:${RELEASE_SERIES}"
          docker tag "$exact_image" "${image_name}:latest"
          docker push "${image_name}:${RELEASE_SERIES}"
          docker push "${image_name}:latest"

  publish-release:
    # Gufo creates its release as a draft, so every asset is attached before
    # the release is public and, with immutable releases, before it is locked.
    # A windows-only or deb-only run doesn't publish: publish that draft by hand.
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.windows-only || inputs.deb-only)) }}
    needs: [prepare, publish-windows, build-deb, build-and-push]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - name: Create Gufo release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: gufo-org
          repositories: gufo
          permission-contents: write

      - name: Publish the Gufo draft release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          is_draft=$(gh release view "$RELEASE_TAG" --repo gufo-org/gufo --json isDraft --jq '.isDraft')
          if [[ "$is_draft" != true ]]; then
            echo "Release ${RELEASE_TAG} is already published."
            exit 0
          fi
          gh release edit "$RELEASE_TAG" --repo gufo-org/gufo --draft=false

  publish-apt:
    # Runs once the release is public, since apt clients download the release
    # asset. A deb-only run of an already published release adds it too; a
    # deb-only run of a draft skips with a notice.
    if: ${{ !cancelled() && needs.build-deb.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.publish-release.result) }}
    needs: [prepare, build-deb, publish-release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Create APT repository app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: gufo-org
          repositories: gufo,apt
          permission-contents: write

      - name: Add the Debian package to apt.gufo.blog
        id: publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -o pipefail
          deb/publish-apt "$RELEASE_TAG" | tee "$RUNNER_TEMP/publish-apt.log"
          if grep -q '::notice::' "$RUNNER_TEMP/publish-apt.log"; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and upgrade from apt.gufo.blog in a fresh Debian container
        if: ${{ steps.publish.outputs.skipped != 'true' }}
        run: |
          docker build --target runtime -t gufo-deb-runtime -f deb/Dockerfile deb
          docker run --rm -v "$PWD:/work:ro" gufo-deb-runtime deb/verify-apt "$RELEASE_VERSION"
