name: Publish Stable Gufo Releases

on:
  repository_dispatch:
    types:
      - gufo-release
  workflow_dispatch:
    inputs:
      tag:
        description: Gufo release tag, for example v0.2.0
        required: true
        type: string
      windows-only:
        description: Rebuild and upload only the Windows ZIP
        required: false
        type: boolean
        default: false
      deb-only:
        description: Build and upload only the Debian package
        required: false
        type: boolean
        default: false
      replace-deb-assets:
        description: Replace the Debian package and checksum already attached to this tag
        required: false
        type: boolean
        default: false
      replace-windows-assets:
        description: Replace the Windows ZIP and checksum already attached to this tag
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-stable-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      series: ${{ steps.release.outputs.series }}
    steps:
      - name: Validate release tag
        id: release
        env:
          RELEASE_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          WINDOWS_ONLY: ${{ inputs.windows-only || false }}
          DEB_ONLY: ${{ inputs.deb-only || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a Gufo release tag like v0.2.0, got: $RELEASE_TAG" >&2
            exit 1
          fi

          if [[ "$WINDOWS_ONLY" == true && "$DEB_ONLY" == true ]]; then
            echo "Choose either windows-only or deb-only, not both" >&2
            exit 1
          fi

          version="${RELEASE_TAG#v}"
          {
            echo "tag=${RELEASE_TAG}"
            echo "version=${version}"
            echo "series=${version%.*}"
          } >> "$GITHUB_OUTPUT"

  build-windows:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.deb-only) }}
    needs: prepare
    permissions:
      actions: read
      contents: read
    # Merge Gufo's reusable workflow before enabling this caller. The build
    # definition follows main; its source checkout uses this exact release tag.
    uses: gufo-org/gufo/.github/workflows/windows-build.yml@main
    with:
      release-tag: ${{ needs.prepare.outputs.tag }}

  publish-windows:
    needs: [prepare, build-windows]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      REPLACE_WINDOWS_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.replace-windows-assets }}
    steps:
      # Artifacts uploaded by a called workflow belong to this Toolboxes run.
      - name: Download Windows release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build-windows.outputs.artifact-name }}
          path: release

      - name: Verify Windows release checksum
        working-directory: release
        run: sha256sum --check "gufo-${RELEASE_TAG}-windows-x86_64.zip.sha256"

      # Mint after the Windows build: installation tokens expire in an hour.
      - name: Create Gufo release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: gufo-org
          repositories: gufo
          permission-contents: write

      - name: Attach Windows assets to the Gufo release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --repo gufo-org/gufo
          upload_args=()
          if [[ "$REPLACE_WINDOWS_ASSETS" == true ]]; then
            upload_args+=(--clobber)
          fi
          gh release upload "$RELEASE_TAG" --repo gufo-org/gufo "${upload_args[@]}" \
            "release/gufo-${RELEASE_TAG}-windows-x86_64.zip" \
            "release/gufo-${RELEASE_TAG}-windows-x86_64.zip.sha256"

  build-deb:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.windows-only) }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Build Debian builder and runtime test images
        run: |
          docker build --target builder -t gufo-deb-builder -f deb/Dockerfile deb
          docker build --target runtime -t gufo-deb-runtime -f deb/Dockerfile deb

      - name: Build the release package
        run: |
          mkdir -p release
          docker run --rm --memory 12g --memory-swap 12g \
            -v "$PWD:/work" gufo-deb-builder \
            deb/build-deb "$RELEASE_TAG" /work/release

      - name: Verify installation in a fresh Debian container
        run: |
          docker run --rm -v "$PWD:/work" gufo-deb-runtime \
            deb/verify-deb "/work/release/gufo_${RELEASE_VERSION}-1_amd64.deb" "$RELEASE_VERSION"

      - name: Preserve Debian release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deb-release-${{ needs.prepare.outputs.tag }}
          path: |
            release/*.deb
            release/*.deb.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Create Gufo release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: gufo-org
          repositories: gufo
          permission-contents: write

      - name: Attach Debian assets to the Gufo release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPLACE_DEB_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.replace-deb-assets }}
        working-directory: release
        run: |
          sha256sum --check "gufo_${RELEASE_VERSION}-1_amd64.deb.sha256"
          gh release view "$RELEASE_TAG" --repo gufo-org/gufo
          upload_args=()
          if [[ "$REPLACE_DEB_ASSETS" == true ]]; then
            upload_args+=(--clobber)
          fi
          gh release upload "$RELEASE_TAG" --repo gufo-org/gufo "${upload_args[@]}" \
            "gufo_${RELEASE_VERSION}-1_amd64.deb" \
            "gufo_${RELEASE_VERSION}-1_amd64.deb.sha256"

  build-and-push:
    if: ${{ !(github.event_name == 'workflow_dispatch' && (inputs.windows-only || inputs.deb-only)) }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - gufo-runtime
          - gufo-dev
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SERIES: ${{ needs.prepare.outputs.series }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo docker system prune --all --force
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.1
        with:
          extra_nix_config: |
            extra-substituters = https://gufo.cachix.org
            extra-trusted-public-keys = gufo.cachix.org-1:rfZe3n4lHINgyoACKzs5EthIZmBNvEyCCtufUpth0PE=
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Gufo release identity
        shell: bash
        run: |
          set -euo pipefail
          gufo_input="github:gufo-org/gufo/${RELEASE_TAG}"
          actual_version=$(nix eval --raw "${gufo_input}#lib.releaseVersion")
          if [[ "$actual_version" != "$RELEASE_VERSION" ]]; then
            echo "Tag ${RELEASE_TAG} reports version ${actual_version}, expected ${RELEASE_VERSION}" >&2
            exit 1
          fi

      - name: Publish stable image tags
        shell: bash
        run: |
          set -euo pipefail
          image_name="${{ env.IMAGE_PREFIX }}/${{ matrix.target }}"
          exact_image="${image_name}:${RELEASE_VERSION}"
          gufo_input="github:gufo-org/gufo/${RELEASE_TAG}"

          if docker manifest inspect "$exact_image" >/dev/null 2>&1; then
            echo "Using existing immutable image ${exact_image}."
            docker pull "$exact_image"
            publish_exact=false
          else
            nix build \
              --override-input gufo-engine "$gufo_input" \
              ".#packages.x86_64-linux.${{ matrix.target }}-release-image" \
              --out-link "result-${{ matrix.target }}"
            docker load < "result-${{ matrix.target }}"
            publish_exact=true
          fi

          docker run --rm "$exact_image" gufo --version \
            | grep -F "gufo version ${RELEASE_VERSION} ("
          if [[ "$publish_exact" == true ]]; then
            docker push "$exact_image"
          fi
          docker tag "$exact_image" "${image_name}:${RELEASE_SERIES}"
          docker tag "$exact_image" "${image_name}:latest"
          docker push "${image_name}:${RELEASE_SERIES}"
          docker push "${image_name}:latest"
